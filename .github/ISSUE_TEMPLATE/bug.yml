name: Bug report
description: Report behaviour an assertion does not keep to.
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Report a vulnerability through a private advisory rather than here.

  - type: input
    id: version
    attributes:
      label: Version
      description: The tag or the commit of bats-expect you run.
      placeholder: v1.0.0
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: The output of `bats --version`, `bash --version | head -1` and `uname -sr`.
      render: shell
    validations:
      required: true

  - type: textarea
    id: table
    attributes:
      label: The test
      description: The smallest `@test` that shows the behaviour: the value or the `run`, and the assertion.
      render: bash
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected
      description: The behaviour the README led you to expect.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: What happened
      description: What the assertion did instead. Paste the failure report whole rather than a summary of it.
      render: shell
    validations:
      required: true
